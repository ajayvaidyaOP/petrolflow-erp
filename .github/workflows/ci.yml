name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Database isolation (see the "Database isolation" step in each job):
#   * verify  -> petroflow_test  (suffix _test is enforced by the Java suite itself)
#   * e2e     -> petroflow_e2e   (suffix _e2e)
#   * the production schema name "petroflow" is never created, referenced or connected to.
#
# Every application step uses the schema-scoped, unprivileged account declared in `env` below.
# The MySQL service container needs an initial root password to start; it is declared only in
# the service definition and never exported to an application step. The single provisioning
# step that does need administrator access receives the root password through its own step
# `env:` block and is the only place root credentials are used.
#
# Keep this file free of duplicate mapping keys: a repeated key makes GitHub reject the whole
# workflow ("Invalid workflow file"), which fails every run before a single step executes.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          # Container-initialisation only; this account is never handed to an application step.
          MYSQL_ROOT_PASSWORD: ci-local-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-local-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: development
      # What the Java API and the test suite read.
      PETROFLOW_DB_HOST: 127.0.0.1
      PETROFLOW_DB_PORT: '3306'
      PETROFLOW_DB_NAME: petroflow_test
      PETROFLOW_DB_USER: petroflow_test_app
      PETROFLOW_DB_PASSWORD: petroflow_test_only
      # The same values for the mysql/mysqldump command-line client.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: petroflow_test
      MYSQL_USER: petroflow_test_app
      MYSQL_PASSWORD: petroflow_test_only
      TEST_DB_NAME: petroflow_test
      PETROFLOW_TEST_DB_DISPOSABLE: 'true'
      # Demo rows are explicit in development; production-like behaviour is covered by the
      # suite's own Config.load(Map) cases, so these must stay out of the ambient environment.
      SEED_DEMO_DATA: 'true'
      ENABLE_DEMO_TOOLS: 'true'
      DEMO_PASSWORD: PetroFlow@2025
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Provision disposable schema and scoped test principal (administrator only)
        env:
          MYSQL_ROOT_PASSWORD: ci-local-root
        run: |
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -P 3306 -u root <<'SQL'
          CREATE DATABASE IF NOT EXISTS petroflow_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'petroflow_test_app'@'%' IDENTIFIED BY 'petroflow_test_only';
          -- This fresh job service creates the account; no roles are granted.
          -- Only petroflow_test is required by db:seed, the backend suite, and mysqldump.
          -- Schema DDL/reset requires CREATE, ALTER, DROP, INDEX, REFERENCES; app data uses CRUD.
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON petroflow_test.* TO 'petroflow_test_app'@'%';
          SHOW GRANTS FOR 'petroflow_test_app'@'%';
          SELECT user, host, Create_priv, Drop_priv, Grant_priv, File_priv, Process_priv, Super_priv
            FROM mysql.user WHERE user='petroflow_test_app';
          SQL
          grants="$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -N -h 127.0.0.1 -P 3306 -u root -e "SHOW GRANTS FOR 'petroflow_test_app'@'%'")"
          printf '%s\n' "$grants"
          if printf '%s\n' "$grants" | grep -F 'ON *.*' | grep -vF 'GRANT USAGE ON *.*'; then
            echo 'Unexpected global privilege on test application account' >&2
            exit 1
          fi
          if printf '%s\n' "$grants" | grep -E '^GRANT .* TO ' | grep -v ' ON '; then
            echo 'Unexpected role grant on test application account' >&2
            exit 1
          fi

      - name: Database isolation guard (test schema only, never "petroflow")
        run: |
          set -euo pipefail
          if [ "$PETROFLOW_DB_NAME" = "petroflow" ]; then
            echo "Refusing to run CI against the production schema name." >&2
            exit 1
          fi
          case "$PETROFLOW_DB_NAME" in
            *_test) ;;&
            *) echo "CI database must end in _test (got $PETROFLOW_DB_NAME)" >&2; exit 1 ;;&
          esac
          MYSQL_PWD="$MYSQL_PASSWORD" mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" \
            -e "SELECT DATABASE(), CURRENT_USER();" "$MYSQL_DATABASE"
          MYSQL_PWD="$MYSQL_PASSWORD" mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" \
            -e "SHOW DATABASES;" | grep -qx "$MYSQL_DATABASE"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install frontend & test dependencies
        run: npm ci

      - name: MySQL schema and seed smoke test (pre-created disposable test schema)
        run: npm run db:seed

      - name: Typecheck frontend & compile Java 21 backend
        run: npm run typecheck

      - name: Java 21 unit + MySQL HTTP integration tests
        id: java-tests
        # --console=plain keeps the suite's own lines (including ::error annotations) in order;
        # rich consoles rewrite the output in place and can hide the failing assertion.
        # tee keeps the tail available for the annotation step below, which does not depend on
        # the log bundle being downloadable (it is not, on restricted networks).
        run: |
          set -o pipefail
          npm test -- --console=plain 2>&1 | tee /tmp/java-tests.log

      - name: Report Java test output on failure
        if: failure() && steps.java-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          text = open('/tmp/java-tests.log', errors='replace').read()[-2000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error title=Java backend test output::{escaped}")
          PY

      - name: Build frontend assets & package Java API jar
        run: npm run build

      - name: MySQL mysqldump smoke test (disposable test schema)
        run: |
          MYSQL_PWD="$MYSQL_PASSWORD" mysqldump --single-transaction --no-tablespaces -h 127.0.0.1 -P 3306 -u "$MYSQL_USER" petroflow_test > /tmp/petroflow-test-backup.sql
          test -s /tmp/petroflow-test-backup.sql

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    services:
      mysql:
        image: mysql:8.0
        env:
          # Container-initialisation only; this account is never handed to an application step.
          MYSQL_ROOT_PASSWORD: ci-local-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-local-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: development
      PETROFLOW_DB_HOST: 127.0.0.1
      PETROFLOW_DB_PORT: '3306'
      PETROFLOW_DB_NAME: petroflow_e2e
      PETROFLOW_DB_USER: petroflow_e2e_app
      PETROFLOW_DB_PASSWORD: petroflow_e2e_only
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: petroflow_e2e
      MYSQL_USER: petroflow_e2e_app
      MYSQL_PASSWORD: petroflow_e2e_only
      E2E_MYSQL_DATABASE: petroflow_e2e
      SEED_DEMO_DATA: 'true'
      ENABLE_DEMO_TOOLS: 'true'
      DEMO_PASSWORD: PetroFlow@2025
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Provision E2E-scoped principal (administrator only)
        env:
          MYSQL_ROOT_PASSWORD: ci-local-root
        run: |
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -P 3306 -u root <<'SQL'
          CREATE DATABASE IF NOT EXISTS petroflow_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'petroflow_e2e_app'@'%' IDENTIFIED BY 'petroflow_e2e_only';
          -- Same schema-local DDL and CRUD privileges; no global or production grants.
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON petroflow_e2e.* TO 'petroflow_e2e_app'@'%';
          SHOW GRANTS FOR 'petroflow_e2e_app'@'%';
          SQL
          grants="$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -N -h 127.0.0.1 -P 3306 -u root -e "SHOW GRANTS FOR 'petroflow_e2e_app'@'%'")"
          printf '%s\n' "$grants"
          if printf '%s\n' "$grants" | grep -F 'ON *.*' | grep -vF 'GRANT USAGE ON *.*'; then
            echo 'Unexpected global privilege on E2E application account' >&2
            exit 1
          fi
          if printf '%s\n' "$grants" | grep -E '^GRANT .* TO ' | grep -v ' ON '; then
            echo 'Unexpected role grant on E2E application account' >&2
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - name: Database isolation guard (e2e schema only, never "petroflow")
        run: |
          set -euo pipefail
          if [ "$MYSQL_DATABASE" = "petroflow" ] || [ "$MYSQL_DATABASE" = "petroflow_test" ]; then
            echo "Refusing to run E2E against $MYSQL_DATABASE." >&2
            exit 1
          fi
          case "$MYSQL_DATABASE" in
            *_e2e) ;;&
            *) echo "E2E database must end in _e2e (got $MYSQL_DATABASE)" >&2; exit 1 ;;&
          esac
          MYSQL_PWD="$MYSQL_PASSWORD" mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" \
            -e "SELECT DATABASE(), CURRENT_USER();" "$MYSQL_DATABASE"
          # Playwright starts the API jar with --reset-db; prove that grant exists before the run.
          MYSQL_PWD="$MYSQL_PASSWORD" mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" \
            -e "SHOW DATABASES;" | grep -qx "$MYSQL_DATABASE"

      - name: Package Java 21 API jar
        run: node scripts/gradle.mjs jar --no-daemon

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser workflows (React/Vite + Java 21 API + MySQL 8)
        id: e2e-tests
        # The log bundle is not reachable from every network, so keep the reporter output locally
        # and republish the failing summary as an annotation in the step below.
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log

      - name: Report browser test output on failure
        if: failure() && steps.e2e-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re
          text = open('/tmp/e2e.log', errors='replace').read()
          keep = [line for line in text.splitlines() if re.search(r'(✘|✓|›|Error:|expect\(|Received|Expected|at .*\.ts:)', line)]
          tail = '\n'.join((keep or text.splitlines())[-40:])[-2000:]
          escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error title=Playwright failures::{escaped}")
          PY

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7